# Exclude rules for sync_vps_docker.py, read automatically from this folder.
#
# A line starting with / is an absolute path on the VPS: that path and everything
# under it is skipped.
# Any other line is a file or folder NAME (globs allowed: *.log), matched at any
# depth. No slash inside a name rule, it would never match.
# Excluded paths are never deleted locally, even with VPS_DELETE=true.

# Folder names skipped wherever they appear
.git
__pycache__

# Raw MariaDB files: heavy, and unusable as a backup while the server runs
# (the dumps under mariadb_backups are the real backup). Uncomment to skip them.
